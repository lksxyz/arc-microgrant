$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'
tags: ['backend']

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - '*.{json,ts,js,jsonc}'

tasks:
  dev:
    command: 'pnpm'
    args: ['run', 'dev']
    preset: 'server'
  build:
    command: 'pnpm'
    args: ['run', 'build']
    inputs: ['@group(sources)', '@group(configs)']
  typecheck:
    command: 'pnpm'
    args: ['run', 'typecheck']
    inputs: ['@group(sources)', '@group(configs)']
  deploy:
    command: 'pnpm'
    args: ['run', 'deploy']
    deps: ['typecheck']
